name: Build WorldWave Radio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="WorldWaveRadio.zip"
          if [ ! -f "$ZIP" ]; then ZIP=$(ls *.zip | head -n 1); fi
          echo "Using $ZIP"
          rm -rf build_src && mkdir build_src
          unzip -q "$ZIP" -d build_src
          SETTINGS=$(find build_src -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        continue-on-error: true
        run: gradle testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldWaveRadio-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
